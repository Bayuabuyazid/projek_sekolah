
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard Hidroponik | SMEXA Smart</title>

    <link rel="stylesheet" href="style.css?v=6">
    <script src="script.js?v=4" defer></script>
</head>
<body>

    <header class="navbar">
        <a href="../../landing/index.html" class="logo" aria-label="SMEXA Smart, kembali ke Beranda">
            <img
                src="../../../IMG/WhatsApp%20Image%202026-11-03%20at%2007.19.56.jpeg"
                alt="Logo SMKN 1 Probolinggo"
                class="logo-image"
                width="42"
                height="42"
            >
            <span>SMEXA</span>
            <span class="logo-smart">SMART</span>
        </a>
        <nav class="nav-menu" aria-label="Navigasi utama">
            <a href="../../landing/index.html">Beranda</a>
            <details class="nav-apps">
                <summary>Sistem</summary>
                <div class="nav-app-options">
                    <a href="../../dashboard/index.html">Dashboard</a>
                    <a href="index.html" aria-current="page">Hidroponik</a>
                    <a href="../taman-depan/index.html">Taman Depan</a>
                </div>
            </details>
        </nav>
    </header>

    <main>

        <!-- Pemantauan sensor -->
        <section id="monitoring">
            <h2>Pemantauan Air</h2>

            <div class="sensor-container">

                <div class="sensor-card">
                    <h3>TDS Air</h3>
                    <p id="tds-air">--</p>
                    <span>PPM</span>
                </div>

                <div class="sensor-card">
                    <h3>Kedalaman Air</h3>
                    <p id="kedalaman-air">--</p>
                    <span>cm</span>
                </div>

                <div class="sensor-card">
                    <h3>pH Air</h3>
                    <p id="ph-air">--</p>
                    <span>Skala 0–14</span>
                </div>

            </div>
        </section>

        <!-- Kontrol pompa -->
        <section id="kontrol-pompa">
            <h2>Kontrol Pompa</h2>

            <p>Status Pompa: <strong id="status-pompa">OFF</strong></p>

            <button id="tombol-pompa" type="button">
                NYALAKAN POMPA
            </button>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 SMEXA Smart</p>
    </footer>

</body>
</html>
