<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

<body>

    <header class="navbar">
        <a href="../../landing/index.html" class="logo" aria-label="SMEXA Smart, kembali ke Beranda">
            <img
                src="../../../IMG/WhatsApp%20Image%202026-11-03%20at%2007.19.56.jpeg"
                alt="Logo SMKN 1 Probolinggo"
                class="logo-image"
                width="42"
                height="42"

            <span>SMEXA</span>
            <span class="logo-smart">SMART</span>

        <nav class="nav-menu" aria-label="Navigasi utama">
            <a href="../../landing/index.html">Beranda</a>
            <details class="nav-apps">

    <main>
        <section id="monitoring">
            <h2>Pemantauan Taman</h2>

            <div class="sensor-container single-column">
                <div class="sensor-card">
                    <h3>Kelembapan Tanah</h3>
                    <p id="kelembapan-tanah">--</p>
                    <span>%</span>
                </div>
            </div>
        </section>

        <section id="kontrol-pompa">
            <h2>Kontrol Penyiraman</h2>
            <p>Status Penyiraman: <strong id="status-pompa">OFF</strong></p>
            <button id="tombol-pompa" type="button">NYALAKAN PENYIRAMAN</button>
            <p>Kontrol saat ini masih berupa simulasi dan belum terhubung ke pompa fisik.</p>
        </section>
    </main>

    <footer>
